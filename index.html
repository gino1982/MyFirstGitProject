<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記事本與日曆</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  textarea { width: 100%; height: 200px; margin-top: 10px; }
</style>
</head>
<body>
<h1>記事本與日曆</h1>
<label for="note-date">選擇日期:</label>
<input type="date" id="note-date">

<textarea id="note-text" placeholder="輸入筆記..."></textarea>

<script>
const dateInput = document.getElementById('note-date');
const noteText = document.getElementById('note-text');

function loadNote(date) {
  if (!date) return;
  noteText.value = localStorage.getItem('note-' + date) || '';
}

dateInput.addEventListener('change', () => {
  loadNote(dateInput.value);
});

noteText.addEventListener('input', () => {
  const date = dateInput.value;
  if (date) {
    localStorage.setItem('note-' + date, noteText.value);
  }
});

window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;
  loadNote(today);
});
</script>
</body>
</html>
